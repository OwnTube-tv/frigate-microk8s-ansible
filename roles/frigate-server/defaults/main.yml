---

frigate_servers_group: all

frigate_vg_device: /dev/sda

frigate_data_mount: /srv/frigate

frigate_image_tag: 0.17.2

# The five site cameras, all on the default LAN (192.168.4.0/24). Numbered
# rather than named after where they point: re-aiming or swapping a camera
# then never forces a vault edit, because the mounting position lives in the
# Frigate configuration while the credentials stay under the same number.
#
# The number tracks the last octet: camera n is 192.168.4.(11 + n). That is
# not load-bearing anywhere — nothing derives one from the other — but it
# makes a wrong number visible at a glance instead of only at runtime.
#
#   1 — Reolink Duo 2          "Driveway Duo 2 W"
#   2 — Reolink Duo 2V         "Back Yard Duo 2V E"
#   3 — Reolink Duo 2V         "Back Yard Duo 2V N"
#   4 — Reolink TrackMix P760  "Corner TrackMix SE"
#   5 — Reolink TrackMix P760  "Back Yard TrackMix NE"
frigate_camera_1_host: 192.168.4.12
frigate_camera_2_host: 192.168.4.13
frigate_camera_3_host: 192.168.4.14
frigate_camera_4_host: 192.168.4.15
frigate_camera_5_host: 192.168.4.16

# Camera credentials come from the Ansible Vault (secrets.yaml). Every camera
# carries its own pair because each Reolink keeps a separate user database —
# the same account name provisioned five times is still five accounts, and
# one of them can have its password rotated without touching the others.
frigate_camera_1_username:
frigate_camera_1_password:
frigate_camera_2_username:
frigate_camera_2_password:
frigate_camera_3_username:
frigate_camera_3_password:
frigate_camera_4_username:
frigate_camera_4_password:
frigate_camera_5_username:
frigate_camera_5_password:

# Flip to yes to remove the whoami test deployment and point
# https://ranchen.owntube.se at Frigate
frigate_ingress_cutover: no

...
