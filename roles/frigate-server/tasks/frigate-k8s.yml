---

# The credentials are declared but empty in the role defaults, so a run that
# forgets the vault renders the literal "None" into every RTSP URL and leaves
# Frigate up with dead streams and nothing in the Ansible output to say why.
# Fail here instead, before anything reaches the cluster.
#
# The loop has to list every camera. It was written for three and did not grow
# with cameras 4 and 5, which left the guard silently absent for exactly the
# two newest cameras — the ones most likely to be missing from a vault.
- name: Assert that every camera has credentials from the vault
  ansible.builtin.assert:
    that:
      - vars['frigate_camera_' ~ item ~ '_username'] | default('', true) | length > 0
      - vars['frigate_camera_' ~ item ~ '_password'] | default('', true) | length > 0
    fail_msg: >-
      Camera {{ item }} has no credentials. Load the vault with
      '-e @secrets.yaml', and check that it defines
      frigate_camera_{{ item }}_username and frigate_camera_{{ item }}_password.
    quiet: yes
  loop: [1, 2, 3, 4, 5]
  tags: frigate-k8s

- name: Create 'frigate' namespace
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: frigate
    state: present
  tags: frigate-k8s

- name: Render the Frigate configuration from template
  ansible.builtin.set_fact:
    frigate_config: "{{ lookup('template', 'frigate-config.yml.j2') }}"
  no_log: true
  tags: frigate-k8s

- name: Create ConfigMap with the Frigate configuration
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: frigate-config-file
        namespace: frigate
      data:
        config.yml: "{{ frigate_config }}"
    state: present
  no_log: true
  tags: frigate-k8s

- name: Create PersistentVolumeClaim for the Frigate database and runtime state
  kubernetes.core.k8s:
    definition: "{{ lookup('file', 'frigate-config-pvc.yml') | from_yaml }}"
    state: present
  tags: frigate-k8s

- name: Create Frigate Deployment
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'frigate-deployment.yml.j2') | from_yaml }}"
    state: present
  tags: frigate-k8s

- name: Create Frigate Service
  kubernetes.core.k8s:
    definition: "{{ lookup('file', 'frigate-service.yml') | from_yaml }}"
    state: present
  tags: frigate-k8s

- name: Take over 'ranchen.owntube.se' from the whoami test deployment
  when: frigate_ingress_cutover
  tags: frigate-k8s
  block:
    - name: Remove whoami test resources
      kubernetes.core.k8s:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: whoami
        namespace: default
        state: absent
      loop:
        - { api_version: networking.k8s.io/v1, kind: Ingress }
        - { api_version: v1, kind: Service }
        - { api_version: apps/v1, kind: Deployment }
      loop_control:
        label: "{{ item.kind }}/whoami"

    - name: Create Frigate ingress for https://ranchen.owntube.se
      kubernetes.core.k8s:
        definition: "{{ lookup('file', 'frigate-ingress.yml') | from_yaml }}"
        state: present

...
